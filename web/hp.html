<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>HP</title>
<style>
/* ═══ Reset ═══ */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* ═══ SAO Fonts ═══ */
@font-face { font-family: 'sao'; src: url('../assets/fonts/SAOUI.ttf'); }
@font-face { font-family: 'yuanJWD'; src: url('../assets/fonts/ZhuZiAYuanJWD.ttf'); }

/* ═══ Body — native pywebview transparency ═══
   transparent=True in pywebview handles the background.
   All non-content areas become transparent. */
html, body {
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
    overflow: visible;
}

body {
    padding: 8px 10px 0 10px;
}

/* ═══════════════════════════════════════
   HP Component — exact copy from SAO-UI
   packages/HP/src/index.vue
   ═══════════════════════════════════════ */
/* ═══ Entry Animation ═══ */
@keyframes hp-slide-in {
    0%   { opacity: 0; transform: scale(0.7); }
    60%  { opacity: 1; transform: scale(1.03); }
    100% { opacity: 1; transform: scale(1); }
}
/* ═══ Idle Float (sinusoidal Lissajous, ≤5px) ═══ */
@keyframes sao-float {
    0%   { transform: translate(0px,    0px); }
    12%  { transform: translate(2px,   -3px); }
    25%  { transform: translate(4px,   -1px); }
    38%  { transform: translate(3px,    2.5px); }
    50%  { transform: translate(0.5px,  4px); }
    62%  { transform: translate(-2.5px, 2.5px); }
    75%  { transform: translate(-4px,  -0.5px); }
    88%  { transform: translate(-2px,  -3px); }
    100% { transform: translate(0px,    0px); }
}

.XTBox {
    --bgColor: rgba(205, 221, 248, 0.75);
    --fontcolor: #e1dede;
    --hover: rgba(229, 231, 236, 0.6);
    position: relative;
    width: 400px;
    height: 40px;
    display: flex;
    filter: drop-shadow(2px 4px 3px rgba(50, 50, 0, 0.5));
    font-family: 'sao', 'yuanJWD', sans-serif;
    letter-spacing: 1px;
    color: #e1dede;
    font-size: 12px;
    cursor: grab;
    animation: hp-slide-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both,
               sao-float 9s ease-in-out 0.7s infinite;
}

.xt_left, .xt_right, .number_xt { height: 100%; }

.xt_left {
    width: 22px;
    clip-path: polygon(0% 25%, 50% 25%, 50% 75%, 0% 75%, 0% 100%, 100% 100%, 100% 0%, 0% 0%);
    margin-right: 3px;
    background: var(--bgColor);
    transition: background 0.15s ease;
}

.xt_right {
    flex: 1;
    clip-path: polygon(75px 22%, 100% 22%, 100% 0%, 0% 0%, 0 100%, 210px 100%, 210px 80%, 100% 80%, 100% 60%, 200px 60%, 195px 77%, 75px 77%);
    background: linear-gradient(to right, var(--bgColor) 50%, rgba(220, 212, 212, 0));
    display: flex;
    align-items: center;
    user-select: none;
    transition: background 0.15s ease;
}

.xt_right > span {
    min-width: 70px;
    max-width: 72px;
    text-align: center;
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
    padding-left: 10px;
}

.number_xt {
    position: absolute;
    top: 90%;
    left: 60%;
    width: 150px;
    height: 20px;
    display: flex;
}

.number_xt > div {
    background: var(--bgColor);
    box-shadow: -4px 3px 27px 3px rgba(0, 0, 0, 0.1);
    padding-right: 5px;
    text-align: right;
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
    user-select: none;
    transition: background 0.15s ease;
}

.number_xt div:nth-child(1) { width: 69%; margin-right: 3px; }
.number_xt div:nth-child(2) { width: 30%; }

/* ═══ Hover ═══ */
.XTBox:hover .xt_left,
.XTBox:hover .number_xt div {
    background: var(--hover);
}
.XTBox:hover .xt_right {
    background: linear-gradient(to right, var(--hover) 50%, rgba(220, 212, 212, 0));
}
.XTBox:hover .xt_border { opacity: .8; }

/* ═══ SVG border ═══ */
.svg_border {
    position: absolute;
    left: 100px;
    top: 8px;
}

/* ═══ HP bar border + fill ═══ */
.xt_border {
    position: absolute;
    left: 100px;
    top: 8px;
    width: 260px;
    height: 23px;
    clip-path: polygon(120px 100%, 124px 16px, 98% 16px, 100% 0%, 0% 0%, 0% 100%);
    display: flex;
    opacity: .85;
    transition: opacity 0.15s ease;
}

.xt_border_left {
    width: 1.5px;
    height: 100%;
    background: rgb(218, 215, 215);
}

.xt_border_right {
    flex: 1;
    height: 100%;
}

.tb_line {
    width: 100%;
    height: 1px;
    background: rgb(218, 215, 215);
}

.xt_in {
    height: 21px;
    width: 100%;
    transition: width 0.3s ease, background 0.3s ease;
}

.xt_in_green {
    background: linear-gradient(to right, rgb(211, 234, 124), rgb(154, 211, 52));
}
.xt_in_yellow {
    background: linear-gradient(to right, rgb(235, 238, 112), rgb(244, 250, 73));
}
.xt_in_red {
    background: linear-gradient(to right, rgb(248, 140, 122), rgb(239, 104, 78));
}

/* ═══ Playing status indicator ═══ */
@keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1.0; }
}
.XTBox.playing .xt_left {
    background: rgba(154, 211, 52, 0.6);
    animation: pulse 1.5s ease-in-out infinite;
}
.XTBox.paused .xt_left {
    background: rgba(244, 250, 73, 0.6);
}

/* ═══ Context Menu — compact 5 items ═══ */
.context-menu {
    display: none;
    position: fixed;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(8px);
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    font-family: 'yuanJWD', 'Microsoft YaHei UI', sans-serif;
    font-size: 12px;
    color: #333;
    z-index: 1000;
    min-width: 140px;
    padding: 3px 0;
    -webkit-app-region: no-drag;
}
.context-menu.show { display: block; }
.context-menu .cm-item {
    padding: 4px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
}
.context-menu .cm-item:hover {
    background: rgba(243, 175, 18, 0.8);
    color: #fff;
}
.context-menu .cm-sep {
    height: 1px;
    background: #e0e0e0;
    margin: 2px 6px;
}

/* ═══ Level Up Overlay ═══ */
@keyframes lv-bg-anim {
    0%   { background: rgba(0,0,0,0); }
    8%   { background: rgba(243,175,18,0.85); }
    22%  { background: rgba(255,255,255,0.80); }
    35%  { background: rgba(26,26,26,0.88); }
    78%  { background: rgba(26,26,26,0.35); }
    100% { background: rgba(26,26,26,0); }
}
@keyframes lv-text-anim {
    0%   { transform: scale(0.05); opacity: 0; }
    30%  { transform: scale(1.10); opacity: 1; }
    42%  { transform: scale(0.95); }
    55%  { transform: scale(1.00); opacity: 1; }
    80%  { transform: scale(1.00); opacity: 0.95; }
    100% { transform: scale(1.00); opacity: 0; }
}
#lv-overlay {
    display: none;
    position: fixed;
    left: -10px;
    top: -8px;
    width: 430px;
    height: 280px;
    z-index: 999;
    pointer-events: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    overflow: hidden;
}
#lv-overlay.show {
    display: flex;
    animation: lv-bg-anim 2.6s ease forwards;
}
#lv-overlay .lv-content {
    text-align: center;
    animation: lv-text-anim 2.6s ease forwards;
    animation-delay: 0.08s;
    opacity: 0;
}
.lv-title {
    font-family: 'sao', 'yuanJWD', sans-serif;
    font-size: 38px;
    font-weight: bold;
    color: #f3af12;
    text-shadow: 0 0 24px rgba(243,175,18,0.95), 0 2px 8px rgba(0,0,0,0.95);
    letter-spacing: 4px;
    line-height: 1;
}
.lv-num {
    font-family: 'sao', 'yuanJWD', sans-serif;
    font-size: 22px;
    color: #ffffff;
    margin-top: 10px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.95);
    letter-spacing: 2px;
}
</style>
</head>
<body>

<!-- HP Component -->
<div class="XTBox" id="hp">
    <div class="xt_left"></div>
    <div class="xt_right"><span id="username">Player</span></div>
    <div class="number_xt">
        <div id="hp-value">0/0</div>
        <div id="hp-level">lv.1</div>
    </div>
    <div class="xt_border">
        <div class="xt_border_left"></div>
        <div class="xt_border_right">
            <div class="tb_line"></div>
            <div class="xt_in xt_in_green" id="hp-fill" style="width:100%"></div>
            <div class="tb_line"></div>
        </div>
    </div>
    <svg height="23px" width="260px" class="svg_border">
        <polygon points="0,0 260,0 255,16 124,16 120,23 0,23"
                 style="fill:none;stroke:rgb(218,215,215);stroke-width:1;"/>
    </svg>
</div>

<!-- Level Up Overlay -->
<div id="lv-overlay">
    <div class="lv-content">
        <div class="lv-title">LEVEL UP!</div>
        <div class="lv-num" id="lv-num">Lv.1 → Lv.2</div>
    </div>
</div>

<!-- Context Menu -->
<div class="context-menu" id="ctx-menu">
    <div class="cm-item" data-action="menu">◆ SAO 菜单</div>
    <div class="cm-sep"></div>
    <div class="cm-item" data-action="play">▶ 播放/暂停</div>
    <div class="cm-item" data-action="stop">■ 停止</div>
    <div class="cm-item" data-action="open">▸ 打开文件</div>
    <div class="cm-item" data-action="folder">▸ 文件夹循环</div>
    <div class="cm-sep"></div>
    <div class="cm-item" data-action="speedup">▲ 加速</div>
    <div class="cm-item" data-action="speeddown">▼ 减速</div>
    <div class="cm-sep"></div>
    <div class="cm-item" data-action="switch_sao">◆ SAO Entity UI</div>
    <div class="cm-item" data-action="switch_old">↺ Old School UI</div>
    <div class="cm-sep"></div>
    <div class="cm-item" data-action="leaderboard">◆ 排行榜</div>
    <div class="cm-sep"></div>
    <div class="cm-item" data-action="exit">✕ 退出</div>
</div>

<script>
/* ═══ HP Bar API ═══ */
function updateHP(current, total, level) {
    var el = document.getElementById('hp-value');
    el.textContent = Math.floor(current) + '/' + Math.floor(total);
    document.getElementById('hp-level').textContent = 'lv.' + level;

    var pct = total > 0 ? Math.round(current / total * 100) : 100;
    var fill = document.getElementById('hp-fill');
    fill.style.width = pct + '%';
    fill.classList.remove('xt_in_green', 'xt_in_yellow', 'xt_in_red');
    if (pct < 25) fill.classList.add('xt_in_red');
    else if (pct < 60) fill.classList.add('xt_in_yellow');
    else fill.classList.add('xt_in_green');
}

function setUsername(name) {
    document.getElementById('username').textContent = name;
}

function setPlayState(state) {
    var hp = document.getElementById('hp');
    hp.classList.remove('playing', 'paused');
    if (state === 'playing') hp.classList.add('playing');
    else if (state === 'paused') hp.classList.add('paused');
}

/* ═══ Sound via Python bridge ═══ */
function snd(name) {
    try {
        if (window.pywebview && window.pywebview.api) {
            window.pywebview.api.play_sound(name);
        }
    } catch(e) {}
}

/* ═══ Context Menu helpers ═══ */
var ctxMenu = document.getElementById('ctx-menu');

function showCtxMenu(x, y) {
    if (ctxMenu.classList.contains('show')) {
        hideCtxMenu();
        return;
    }
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.set_ctx_menu_active(true);
    }
    setTimeout(function() {
        ctxMenu.style.left = x + 'px';
        ctxMenu.style.top  = y + 'px';
        ctxMenu.classList.add('show');
    }, 50);
}

function hideCtxMenu() {
    ctxMenu.classList.remove('show');
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.set_ctx_menu_active(false);
    }
}

/* ═══ Drag & Click (manual JS — replaces CSS app-region:drag) ═══
   mousedown+move = drag window,  mousedown+up (no move) = click ═══ */
(function() {
    var hp = document.getElementById('hp');
    var drag = { on: false, sx: 0, sy: 0, moved: false };

    hp.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        /* Ignore if clicking inside context menu */
        if (ctxMenu.contains(e.target)) return;
        drag.on = true;
        drag.sx = e.screenX;
        drag.sy = e.screenY;
        drag.moved = false;
        hp.style.cursor = 'grabbing';
        e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
        if (!drag.on) return;
        var dx = e.screenX - drag.sx;
        var dy = e.screenY - drag.sy;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
            drag.moved = true;
            drag.sx = e.screenX;
            drag.sy = e.screenY;
            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.window_drag(dx, dy);
            }
        }
    });

    document.addEventListener('mouseup', function(e) {
        if (!drag.on) return;
        drag.on = false;
        hp.style.cursor = 'grab';
        if (!drag.moved) {
            /* Click (no drag) → toggle SAO menu */
            snd('click');
            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.toggle_menu();
            }
        }
    });
})();

/* ═══ Right-click → context menu ═══ */
document.getElementById('hp').addEventListener('contextmenu', function(e) {
    e.preventDefault();
    e.stopPropagation();
    snd('click');
    var x = Math.max(0, Math.min(e.clientX, window.innerWidth - 150));
    var y = Math.min(e.clientY, window.innerHeight - 230);
    showCtxMenu(x, Math.max(0, y));
});

/* ═══ Click outside → hide menu ═══ */
document.addEventListener('click', function(e) {
    if (!ctxMenu.contains(e.target) && ctxMenu.classList.contains('show')) {
        hideCtxMenu();
    }
});

/* ═══ Menu item actions ═══ */
ctxMenu.querySelectorAll('.cm-item').forEach(function(item) {
    item.addEventListener('click', function(e) {
        e.stopPropagation();
        hideCtxMenu();
        snd('click');
        var action = this.getAttribute('data-action');
        if (window.pywebview && window.pywebview.api) {
            window.pywebview.api.context_action(action);
        }
    });
});

/* ═══ Level Up Animation ═══ */
var _lvTimer = null;
function showLevelUp(oldLv, newLv) {
    var ov = document.getElementById('lv-overlay');
    document.getElementById('lv-num').textContent = 'Lv.' + oldLv + ' → Lv.' + newLv;
    ov.classList.remove('show');
    void ov.offsetWidth;  /* reflow 重启动画 */
    ov.classList.add('show');
    if (_lvTimer) clearTimeout(_lvTimer);
    _lvTimer = setTimeout(function() { ov.classList.remove('show'); }, 2700);
}
</script>
</body>
</html>
